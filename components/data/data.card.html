<!DOCTYPE html>
<!-- @dsCard group="Components" name="Data: stats, deltas, index table" subtitle="Scorecard stats and the signature numbered table" viewport="700x360" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}
.btn{font-family:var(--font-body);font-weight:500;font-size:15px;padding:12px 24px;border-radius:2px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:transparent;transition:all 250ms cubic-bezier(0.16,1,0.3,1);}
.btn-primary{background:var(--accent);color:#EDEBE5;}
.btn-primary:hover{background:var(--accent-hover);}
.btn:active{transform:scale(0.98);}
.btn-secondary{color:var(--fg-1);border-color:var(--border);}
.btn-secondary:hover{opacity:0.7;}
.btn-ghost{padding:4px 0;border-radius:0;border-bottom:1px solid var(--border);color:var(--fg-1);}
.btn-sm{font-size:13px;padding:8px 16px;}
.btn-dis{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.pill{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--border);border-radius:999px;padding:5px 12px;color:var(--fg-2);}
.field{font-family:var(--font-body);font-size:15px;color:var(--fg-1);background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:12px 14px;outline:none;}
.mono{font-family:var(--font-mono);}
</style></head><body>
<div class="row" style="align-items:stretch">
<div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:2px;box-shadow:var(--shadow-card);padding:20px;display:flex;flex-direction:column;gap:8px">
<span class="lbl">Blended ROAS</span>
<span style="font-size:36px;line-height:1;letter-spacing:-0.02em">4.2×</span>
<span class="mono" style="font-size:12px;color:var(--positive)">▲ 0.6 VS LAST QTR</span>
</div>
<div style="flex:1;background:var(--ink);border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:8px">
<span class="lbl" style="color:var(--ink-fg-2)">Growth index</span>
<span style="font-family:var(--font-numeral);font-weight:700;font-size:52px;line-height:1;color:var(--ink-fg-1)">137.2</span>
<span class="mono" style="font-size:12px;color:var(--positive-ink)">▲ 12.4 YOY</span>
</div>
<div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:2px;box-shadow:var(--shadow-card);padding:20px;display:flex;flex-direction:column;gap:8px">
<span class="lbl">Payback</span>
<span style="font-size:36px;line-height:1;letter-spacing:-0.02em">41 days</span>
<span class="mono" style="font-size:12px;color:var(--hold)">HOLD</span>
</div>
</div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:2px">
<div style="display:grid;grid-template-columns:44px 1fr auto 90px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border)" class="mono lbl"><span>NO.</span><span>WORKSTREAM</span><span>OWNER</span><span>Δ QTR</span></div>
<div style="display:grid;grid-template-columns:44px 1fr auto 90px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border-subtle);font-size:14px;align-items:center"><span class="mono" style="color:var(--accent)">01</span><span>Measurement architecture</span><span style="color:var(--fg-3)">INT</span><span class="mono" style="font-size:12px;color:var(--positive)">▲ +0.7</span></div>
<div style="display:grid;grid-template-columns:44px 1fr auto 90px;gap:16px;padding:12px 20px;font-size:14px;align-items:center"><span class="mono" style="color:var(--accent)">02</span><span>Brand story & creative system</span><span style="color:var(--fg-3)">INT</span><span class="mono" style="font-size:12px;color:var(--positive)">▲ +1.2</span></div>
</div>
</body></html>
