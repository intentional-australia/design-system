<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Signal & semantic" subtitle="Red is signal only; deltas get green/grey" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;}
.lbl{font:var(--text-mono-label);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}

</style></head><body>
<div style="display:flex;gap:12px;align-items:stretch">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--accent);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">RED #D4271C</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--accent-hover);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">HOVER #B81F15</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--accent-soft);border-radius:2px;border:1px solid var(--border);"></div><span class="lbl" style="color:var(--fg-3)">SOFT 8%</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--positive);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">POSITIVE #2E5339</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--negative);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">NEGATIVE #B4231A</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--hold);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">HOLD #77736A</span></div>
</div>
<div style="margin-top:14px;display:flex;gap:20px;font-family:var(--font-mono);font-size:13px">
<span style="color:var(--positive)">▲ 4.2 PTS YOY</span><span style="color:var(--negative)">▼ 0.8 QTR</span><span style="color:var(--hold)">HOLD</span><span style="color:var(--accent)">FIG. 01</span>
</div>
</body></html>
