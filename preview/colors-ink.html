<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ink mode" subtitle="Emphasis panels, decks, signature artifacts" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;}
.lbl{font:var(--text-mono-label);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}
body{background:var(--ink);}
</style></head><body>
<div style="display:flex;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--ink);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">INK #1A1815</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--ink-2);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">INK-2 #26221E</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--ink-fg-1);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">BONE #EDEBE5</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--ink-fg-2);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">STONE #9A9689</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--positive-ink);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">POSITIVE #2E9958</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--accent);border-radius:2px;"></div><span class="lbl" style="color:var(--ink-fg-2)">RED #D4271C</span></div>
</div>
</body></html>
