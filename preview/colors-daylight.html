<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Daylight surfaces" subtitle="Default mode: gesso, chalk, white, ink text" viewport="700x140" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;}
.lbl{font:var(--text-mono-label);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}

</style></head><body>
<div style="display:flex;gap:12px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--bg);border-radius:2px;border:1px solid var(--border);"></div><span class="lbl" style="color:var(--fg-3)">GESSO #EDEBE5</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--bg-2);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">CHALK #DFDCD2</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--surface);border-radius:2px;border:1px solid var(--border);"></div><span class="lbl" style="color:var(--fg-3)">SURFACE #FFFFFF</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--fg-1);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">INK #1A1815</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--fg-2);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">FG-2 #524E45</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:72px;background:var(--fg-3);border-radius:2px;"></div><span class="lbl" style="color:var(--fg-3)">FG-3 #77736A</span></div>
</div>
</body></html>
