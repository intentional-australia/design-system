<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radius, borders, shadow" subtitle="2px default, hairlines do the work" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;}
.lbl{font:var(--text-mono-label);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}

</style></head><body>
<div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);padding:16px"><span class="lbl">CARD · 2PX · HAIRLINE · FAINT SHADOW</span></div>
<div style="flex:1;background:var(--bg-2);border-radius:var(--radius-md);padding:16px"><span class="lbl">WELL · 4PX · NO BORDER</span></div>
<div style="flex:1;background:var(--ink);color:var(--ink-fg-1);border-radius:var(--radius-sm);box-shadow:var(--shadow-panel);padding:16px"><span class="lbl" style="color:var(--ink-fg-2)">INK PANEL · 2PX</span></div>
<div style="display:flex;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 14px">PILL · TAGS ONLY</span></div>
</div>
</body></html>
