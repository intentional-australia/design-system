<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Motif: chart fills" subtitle="10Up patterns become the fill language of data" viewport="700x170" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--fg-1);padding:24px;}
.lbl{font:var(--text-mono-label);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);}

</style></head><body>
<div style="display:flex;gap:32px;align-items:center">
<div style="display:flex;align-items:flex-end;gap:6px;height:110px">
<div style="width:30px;height:40%;background:repeating-linear-gradient(45deg,var(--accent) 0,var(--accent) 1px,transparent 1px,transparent 5px);border:1px solid var(--accent)"></div>
<div style="width:30px;height:62%;background:repeating-linear-gradient(0deg,var(--accent) 0,var(--accent) 1px,transparent 1px,transparent 5px);border:1px solid var(--accent)"></div>
<div style="width:30px;height:78%;background:repeating-radial-gradient(circle,var(--accent) 0,var(--accent) 1px,transparent 1px,transparent 5px);border:1px solid var(--accent)"></div>
<div style="width:30px;height:100%;background:var(--accent)"></div>
</div>
<img src="../assets/10up-red-circles.png" style="height:100px;mix-blend-mode:multiply">
<p style="font:var(--text-body-sm);color:var(--fg-2);max-width:260px;margin:0">Rings, dots, hatches and rays distinguish data series instead of extra colors. Always red, 1px weight. In motion: bars fill with pattern as values count up.</p>
</div>
</body></html>
